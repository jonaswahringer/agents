<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C4 architecture explorer</title>
<style>/* C4_STYLES */</style>
</head>
<body>
<main class="c4" id="c4-explorer" aria-label="C4 architecture explorer">
  <div class="c4-topline"><span class="c4-wordmark">◈ Architecture explorer</span><button type="button" data-action="view-details" hidden>About this view</button><button type="button" data-action="sample">Try 10,400 elements</button></div>
  <nav class="c4-breadcrumb" aria-label="Architecture breadcrumb"></nav>
  <div class="c4-heading"><div><span class="c4-eyebrow"></span><h2 tabindex="-1"></h2><p class="c4-description"></p></div></div>
  <div class="c4-tools"><label class="c4-search-label">Find an element<input type="search" placeholder="Search architecture…" autocomplete="off" aria-controls="c4-results"></label><label class="c4-flow-label">Flow<select aria-label="Highlight a flow"></select></label></div>
  <ul class="c4-results" id="c4-results" aria-label="Search results" hidden></ul>
  <div class="c4-scope"><div class="c4-scope-header"><button type="button" class="c4-back" data-action="back" hidden><span class="c4-back-arrow" aria-hidden="true">←</span><span><span class="c4-back-label">Back to parent</span><strong class="c4-back-destination"></strong></span></button><div class="c4-scope-label"></div></div><div class="c4-stage"><div class="c4-boundaries"></div><svg class="c4-edges" aria-hidden="true"></svg><div class="c4-nodes"></div></div><div class="c4-key" aria-label="Diagram key"></div></div>
  <div class="c4-page"><span class="c4-count"></span><div><button type="button" data-action="previous" aria-label="Previous page">←</button><span class="c4-page-number"></span><button type="button" data-action="next" aria-label="Next page">→</button></div></div>
  <div class="c4-detail" aria-live="polite"></div>
  <dialog class="c4-inspector" aria-labelledby="c4-inspector-title"><div class="c4-inspector-header"><h3 id="c4-inspector-title"></h3><button type="button" data-action="close-inspector" aria-label="Close details">Close ×</button></div><div class="c4-inspector-body"></div></dialog>
  <details class="c4-relations"><summary></summary><ol></ol></details>
  <div class="c4-footer"><span class="c4-metrics"></span><span>Click to explore · Esc to go up</span></div>
  <p class="c4-note">Fictional architecture and illustrative code, not generated from source. Levels and scopes follow the <a href="https://c4model.com/diagrams" target="_blank" rel="noreferrer">C4 model</a>; layout and shapes are explorer choices.</p>
  <span class="c4-live" role="status" aria-live="polite"></span>
</main>
<script>/* C4_ENGINE */</script>
<script>/* C4_DATA */</script>
</body>
</html>
